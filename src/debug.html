<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Glow Debug Test (Updated)</title>
    <style>
        body { 
            background-color: #202020; 
            color: #fff;
            font-family: sans-serif;
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        canvas { 
            background-color: #000; 
            image-rendering: pixelated; 
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            border: 2px solid #555;
        }
    </style>
</head>
<body>
    <h1>Updated Isolated Glow Test</h1>
    <canvas id="debugCanvas"></canvas>
    <p>You should now see a glow. Is it centered correctly?</p>

    <script>
        // --- ⬇️ 1. EDIT THIS LINE ⬇️ ---
        const SPRITESHEET_PATH = '../public/spritesheet.png'; // ⚠️ IMPORTANT: Change this to the real path/filename of your spritesheet!
        
        // --- Values from your original code ---
        const TILE_SIZE = 16; 
        const PLAYER_SPRITE_X = 32 * TILE_SIZE; 
        const PLAYER_SPRITE_Y = 0 * TILE_SIZE;
        const FLOOR_SPRITE_X = 2 * TILE_SIZE;
        const FLOOR_SPRITE_Y = 0 * TILE_SIZE;
        // ------------------------------------

        const canvas = document.getElementById('debugCanvas');
        const ctx = canvas.getContext('2d');

        const img = new Image();
        img.src = SPRITESHEET_PATH;

        img.onload = () => {
            const scale = 10;
            const drawSize = TILE_SIZE * scale;

            // --- 💡 CHANGED SECTION 💡 ---
            // Make the canvas LARGER than the sprite to create space for the glow.
            const padding = drawSize / 2;
            canvas.width = drawSize + padding * 2;
            canvas.height = drawSize + padding * 2;
            const drawPos = padding; // We will now draw the sprite at this offset.
            // -----------------------------

            ctx.imageSmoothingEnabled = false;

            // 1. Draw the floor tile in the center
            ctx.drawImage(
                img,
                FLOOR_SPRITE_X, FLOOR_SPRITE_Y, TILE_SIZE, TILE_SIZE,
                drawPos, drawPos, drawSize, drawSize
            );

            // 2. Draw the player with the glow in the center
            ctx.save();
            ctx.shadowColor = 'gold';
            ctx.shadowBlur = 20; 
            ctx.drawImage(
                img, PLAYER_SPRITE_X, PLAYER_SPRITE_Y, TILE_SIZE, TILE_SIZE,
                drawPos, drawPos, drawSize, drawSize
            );
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.drawImage(
                img, PLAYER_SPRITE_X, PLAYER_SPRITE_Y, TILE_SIZE, TILE_SIZE,
                drawPos, drawPos, drawSize, drawSize
            );
            ctx.restore();
        };

        img.onerror = () => {
            document.body.innerHTML = `<h1 style="color:red;">Error: Could not load the spritesheet. Please check the SPRITESHEET_PATH. You have it set to: '${SPRITESHEET_PATH}'</h1>`;
        };
    </script>
</body>
</html>
